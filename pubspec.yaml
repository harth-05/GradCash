name: gradcash
description: "GradCash - Professional Graduation Finance Management App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Database
  sqflite: ^2.3.0
  path: ^1.9.0
  path_provider: ^2.1.2

  # UI & Styling
  fl_chart: ^0.66.0
  google_fonts: ^6.1.0
  carousel_slider: ^5.0.0
  intl: ^0.19.0

  # File Handling & Exporting
  pdf: ^3.10.8
  printing: ^5.11.1
  excel: ^4.0.6

  # Device Features
  image_picker: ^1.0.7
  url_launcher: ^6.2.5
  share_plus: ^7.2.1
  shared_preferences: ^2.2.2
  local_auth: ^2.1.8
  file_picker: ^8.1.4
  http: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  image_path: "image/GradCash.png"
  android: true
  ios: true

flutter:
  uses-material-design: true
  assets:
    - image/GradCash.png
